services:
  app:
    build: .
    container_name: langgraph-ollama
    volumes:
      - ./:/app
      - ollama_models:/root/.ollama
      - uv_cache:/root/.cache/uv
    ports:
      - "8000:8000"     # FastAPI
      - "11434:11434"   # Ollama (handy for testing)
    environment:
      # === single tiny model (your ask) ===
      - OLLAMA_MODEL=qwen2.5:0.5b-instruct
      - OLLAMA_PREPULL=qwen2.5:0.5b-instruct
      - OLLAMA_HOST=0.0.0.0
      # optional NVIDIA hints (usually not needed with gpus: all)
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # === NVIDIA GPU passthrough ===
    # This is the simplest, non-Swarm way.
    gpus: all

    # If you previously had a 'deploy.resources...' block, delete it.
    # It's for Swarm and is ignored by regular docker-compose.

volumes:
  ollama_models:
  uv_cache:
