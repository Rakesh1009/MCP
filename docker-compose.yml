version: "3.9"

services:
  llm:
    build: ./services/llm
    container_name: mcp-llm
    restart: unless-stopped
    ports:
      - "11434:11434"        # expose for debugging; optional in prod
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    # GPU config: adjust for your setup
    # If you have NVIDIA + nvidia-container-toolkit:
    # gpus: all

  app:
    build: ./services/app
    container_name: mcp-app
    restart: unless-stopped
    depends_on:
      - llm
    env_file:
      - .env                 # you'll create this from .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./services/app:/app  # dev convenience: edit code without rebuild

  # web:
  #   build: ./services/web
  #   container_name: mcp-web
  #   depends_on:
  #     - app
  #   ports:
  #     - "3000:3000"

volumes:
  ollama_models:
